#cloud-config
# A thin, creds-free, server-class seed (#81): the 'ops' user and tmux (#65) —
# nothing that joins a tailnet or admits credentials, no docker, no sshd
# config, no keys. The server posture is OPERATOR-run, converged inside the
# box after box has minted it (#214), and so is the tailnet workload join,
# which holds a pre-auth key — exactly as #69 designed that half: box never
# sees the key, and since #214 box does not run the other half either.
users:
  - name: ops
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
package_update: true
# tmux: 'box tmux' runs 'tmux new-session' INSIDE the box (#65) — and the
# operator babysits the convergence and the workload join through it.
# curl + ca-certificates: they carry the OPERATOR's installer (#214) — the
# first line of the by-hand converge is a 'curl … | bash' inside this box —
# and a bare cloud image is not guaranteed to ship either.
# chrony: step resumed guests back to real UTC even after startup (#174).
write_files:
  - path: /etc/chrony/conf.d/box-makestep.conf
    permissions: "0644"
    content: |
      makestep 1.0 -1
packages:
  - tmux
  - curl
  - ca-certificates
  - chrony
runcmd:
  - systemctl enable chrony
  # Containers share the host clock; VM guests must start chrony (#174).
  - systemd-detect-virt --quiet --container || systemctl start chrony
