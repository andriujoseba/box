#cloud-config
# The whole template: create the user and stop. BOX_USER in box.env must
# match the name here — the file is passed to Incus verbatim.
# The 'sudo:' line below is for SELF-CONVERGING FLEET GUESTS and is NOT
# inherited: a blank box is the seed for a machine whose own first act is
# 'sudo rig runner install' or 'sudo rig bootstrap <role>' (heavy-duty/infra#34
# is doing exactly that), so the tenant needs root to converge itself. DROP IT
# from any agent-family template derived from this one — agents are
# unprivileged inside their own box, and the operator enters as root from the
# host with 'box root <box>' (#177, #176). The contrast with #175 is
# deliberate: BOX_REQUIRE_VM belongs in this seed precisely so every future
# template inherits a hard trust boundary, while sudo must never be inherited
# by default, because blank's descendants are not all agents. Two traits, two
# answers.
users:
  - name: dev
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
package_update: false
# The one package a blank box still needs: 'box tmux' runs 'tmux new-session'
# INSIDE the box, and a bare Debian image ships no tmux — without this it fails
# with "tmux: command not found" (#65). cloud-init refreshes the apt lists on its
# own whenever 'packages' is non-empty, so package_update stays false here.
# chrony: keep resumed guests on real UTC; the drop-in permits stepping after
# Debian's first-three-update window so multi-hour suspend drift closes (#174).
write_files:
  - path: /etc/chrony/conf.d/box-makestep.conf
    permissions: "0644"
    content: |
      makestep 1.0 -1
packages:
  - tmux
  - chrony
runcmd:
  - systemctl enable chrony
  # Containers share the host clock and cannot run a clock-setting daemon;
  # VMs own their clock and must start chrony after cloud-init installs it.
  - systemd-detect-virt --quiet --container || systemctl start chrony
