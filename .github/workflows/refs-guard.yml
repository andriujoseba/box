name: Refs guard
# Its own caller because `edited` is load-bearing: a PR body can gain an
# accidental closing keyword after it opens, with no push to wake ordinary CI
# (ceremony#200). Read-only, one step, no other machinery.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  refs-not-closing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: heavy-duty/ceremony/actions/refs-not-closing@0.7.4
